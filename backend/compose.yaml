
name: banksystem

services:

  postgres:
    image: postgres
    environment:
      - POSTGRES_USER: postgres
      - POSTGRES_PASSWORD=${DB_PASSOWRD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - 5434:5432 
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data: